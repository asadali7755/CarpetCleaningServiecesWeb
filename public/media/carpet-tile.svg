<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <path id="petal" d="M120 96 C130 82 130 66 120 52 C110 66 110 82 120 96 Z"/>
    <path id="leaf" d="M120 34 C128 24 128 14 120 6 C112 14 112 24 120 34 Z"/>
    <g id="mini">
      <rect x="-9" y="-9" width="18" height="18" fill="#C9A227" fill-opacity=".35" stroke="#C9A227" stroke-width="1"/>
      <rect x="-9" y="-9" width="18" height="18" transform="rotate(45)" fill="#C9A227" fill-opacity=".35" stroke="#C9A227" stroke-width="1"/>
      <circle r="3.5" fill="#1E3A8A" fill-opacity=".7"/>
    </g>
    <g id="corner">
      <circle r="34" fill="#1E3A8A" fill-opacity=".10" stroke="#C9A227" stroke-width="1.6"/>
      <circle r="24" fill="#C9A227" fill-opacity=".16" stroke="#1E3A8A" stroke-width="1.1"/>
      <circle r="9" fill="#C9A227" fill-opacity=".6" stroke="#1E3A8A" stroke-width="1"/>
    </g>
  </defs>
  <!-- woven ground -->
  <rect width="240" height="240" fill="#EFE2C3" fill-opacity=".55"/>
  <!-- trellis diamond with a royal ground inside -->
  <path d="M120 0 L240 120 L120 240 L0 120 Z" fill="#1E3A8A" fill-opacity=".09" stroke="#1E3A8A" stroke-opacity=".6" stroke-width="1.3"/>
  <path d="M120 16 L224 120 L120 224 L16 120 Z" fill="none" stroke="#C9A227" stroke-width="1.2" stroke-dasharray="2 5"/>
  <!-- central 8-point star -->
  <g fill="#C9A227" fill-opacity=".22" stroke="#C9A227" stroke-width="1.5">
    <rect x="84" y="84" width="72" height="72"/>
    <rect x="84" y="84" width="72" height="72" transform="rotate(45 120 120)"/>
  </g>
  <!-- eight-petal rosette -->
  <g fill="#1E3A8A" fill-opacity=".3" stroke="#1E3A8A" stroke-width="1">
    <use xlink:href="#petal"/>
    <use xlink:href="#petal" transform="rotate(45 120 120)"/>
    <use xlink:href="#petal" transform="rotate(90 120 120)"/>
    <use xlink:href="#petal" transform="rotate(135 120 120)"/>
    <use xlink:href="#petal" transform="rotate(180 120 120)"/>
    <use xlink:href="#petal" transform="rotate(225 120 120)"/>
    <use xlink:href="#petal" transform="rotate(270 120 120)"/>
    <use xlink:href="#petal" transform="rotate(315 120 120)"/>
  </g>
  <circle cx="120" cy="120" r="15" fill="#C9A227" fill-opacity=".6" stroke="#1E3A8A" stroke-width="1.2"/>
  <circle cx="120" cy="120" r="5" fill="#1E3A8A"/>
  <!-- leaves on the trellis -->
  <g fill="#C9A227" fill-opacity=".6" stroke="#C9A227" stroke-width=".8">
    <use xlink:href="#leaf"/>
    <use xlink:href="#leaf" transform="rotate(90 120 120)"/>
    <use xlink:href="#leaf" transform="rotate(180 120 120)"/>
    <use xlink:href="#leaf" transform="rotate(270 120 120)"/>
  </g>
  <!-- small stars in the open cells -->
  <use xlink:href="#mini" x="60" y="60"/>
  <use xlink:href="#mini" x="180" y="60"/>
  <use xlink:href="#mini" x="60" y="180"/>
  <use xlink:href="#mini" x="180" y="180"/>
  <!-- corner rosettes join neighbouring tiles -->
  <use xlink:href="#corner" x="0" y="0"/>
  <use xlink:href="#corner" x="240" y="0"/>
  <use xlink:href="#corner" x="0" y="240"/>
  <use xlink:href="#corner" x="240" y="240"/>
</svg>
